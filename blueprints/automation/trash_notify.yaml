blueprint:
  name: "Trash Notify — afvalherinnering met bevestiging"
  description: >-
    Uitgebreide afvalherinnering met optionele Ja/Nee-acties en herhalingen.
    De herinneringscyclus loopt alleen zolang Home Assistant actief is.
    Na een herstart kan een lopende cyclus vervallen. Voor bevestigingen is
    de Home Assistant Companion App (iOS of Android) nodig.
    Gebaseerd op https://community.home-assistant.io/t/garbage-reminder/284213
  domain: automation
  author: dkwolf1
  source_url: https://github.com/dkwolf1/Trash-notify/blob/main/blueprints/automation/trash_notify.yaml
  homeassistant:
    min_version: "2026.10.0"
  input:
    planning:
      name: Planning
      icon: mdi:calendar-clock
      input:
        reminder_time:
          name: Tijdstip herinnering
          description: Bijvoorbeeld 18:00, de avond vóór de ophaaldag.
          default: "18:00:00"
          selector:
            time: {}
        day_offset:
          name: Aantal dagen vóór ophalen
          description: 1 = een dag vooraf, 0 = op de ophaaldag.
          default: 1
          selector:
            number:
              min: 0
              max: 7
              step: 1
              mode: box
        date_format:
          name: Datumformaat van de sensoren
          description: Bijvoorbeeld %Y-%m-%d.
          default: "%Y-%m-%d"
          selector:
            text: {}
    sensors:
      name: Afvalkalender
      icon: mdi:trash-can-outline
      input:
        garbage_sensor_1:
          name: Afvalsensor 1
          description: De sensorstatus moet de volgende ophaaldatum bevatten.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
        garbage_sensor_2:
          name: Afvalsensor 2
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
        garbage_sensor_3:
          name: Afvalsensor 3
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
        garbage_sensor_4:
          name: Afvalsensor 4
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
    notification:
      name: Notificaties
      icon: mdi:cellphone-message
      input:
        notifier:
          name: Notificatieactie
          description: >-
            Bijvoorbeeld notify.mobile_app_iphone_dennis of een notify-groep
            met Companion App-telefoons. Voor Ja/Nee zijn actieknoppen nodig.
          default: notify.notify
          selector:
            text: {}
        reminder_title:
          name: Titel
          default: Afvalherinnering
          selector:
            text: {}
        reminder_message:
          name: Tekst vóór de afvallijst
          default: "De volgende container(s) worden opgehaald: "
          selector:
            text: {}
    confirmation:
      name: Bevestiging en herhalingen
      icon: mdi:check-circle-outline
      collapsed: true
      input:
        confirmation_enabled:
          name: Vraag om Ja/Nee-bevestiging
          description: Uit = een gewone eenmalige melding, zonder helper.
          default: false
          selector:
            boolean: {}
        confirmation_question:
          name: Vraag op de telefoon
          default: Staat de container al aan de weg?
          selector:
            text: {}
        reminder_interval_minutes:
          name: Herhaalinterval (minuten)
          description: 10 = tien minuten, 60 = één uur, 120 = twee uur.
          default: 60
          selector:
            number:
              min: 1
              max: 720
              step: 1
              mode: box
        max_notifications:
          name: Maximum aantal meldingen
          description: >-
            Inclusief de eerste melding. Na het maximum wordt niet meer
            automatisch herhaald; de laatste Ja-knop blijft bruikbaar.
          default: 8
          selector:
            number:
              min: 1
              max: 30
              step: 1
              mode: box
        yes_button:
          name: Tekst knop Ja
          default: Ja, staat buiten
          selector:
            text: {}
        no_button:
          name: Tekst knop Nee
          default: Nee, herinner later
          selector:
            text: {}

variables:
  garbage_sensor_1: !input garbage_sensor_1
  garbage_sensor_2: !input garbage_sensor_2
  garbage_sensor_3: !input garbage_sensor_3
  garbage_sensor_4: !input garbage_sensor_4
  reminder_time: !input reminder_time
  day_offset: !input day_offset
  date_format: !input date_format
  reminder_title: !input reminder_title
  reminder_message: !input reminder_message
  confirmation_enabled: !input confirmation_enabled
  confirmation_question: !input confirmation_question
  reminder_interval_minutes: !input reminder_interval_minutes
  max_notifications: !input max_notifications
  yes_button: !input yes_button
  no_button: !input no_button

  sensor_target: "{{ (now() + timedelta(days=day_offset | int)).strftime(date_format) }}"
  due_mask: >-
    {% set ns = namespace(mask=0) %}
    {% for e in [garbage_sensor_1, garbage_sensor_2, garbage_sensor_3, garbage_sensor_4] %}
      {% if e and states(e) == sensor_target %}
        {% set ns.mask = ns.mask + 2 ** loop.index0 %}
      {% endif %}
    {% endfor %}
    {{ ns.mask }}
  due_names: >-
    {% set ns = namespace(names=[]) %}
    {% for e in [garbage_sensor_1, garbage_sensor_2,
                 garbage_sensor_3, garbage_sensor_4] %}
      {% if e and states(e) == sensor_target %}
        {% set ns.names = ns.names + [state_attr(e, 'friendly_name') or e] %}
      {% endif %}
    {% endfor %}
    {{ ns.names | join(', ') }}
actions:
  - if:
      - condition: template
        value_template: "{{ (due_mask | int) > 0 }}"
    then:
      - if:
          - condition: template
            value_template: "{{ not confirmation_enabled }}"
        then:
          - action: !input notifier
            data:
              title: "{{ reminder_title }}"
              message: "{{ reminder_message }}{{ due_names | trim }}"
        else:
          - variables:
              cycle_id: "{{ context.id }}"
              yes_action: "{{ 'TRASH_NOTIFY_YES_' ~ cycle_id }}"
              no_action: "{{ 'TRASH_NOTIFY_NO_' ~ cycle_id }}"
              notification_tag: "{{ 'trash_notify_' ~ cycle_id }}"
              sent_count: 0
              confirmed: false
          - repeat:
              while:
                - condition: template
                  value_template: >-
                    {{ not confirmed and sent_count | int < max_notifications | int }}
              sequence:
                - action: !input notifier
                  data:
                    title: "{{ reminder_title }}"
                    message: |-
                      {{ reminder_message }}{{ due_names | trim }}

                      {{ confirmation_question }}
                    data:
                      tag: "{{ notification_tag }}"
                      actions:
                        - action: "{{ yes_action }}"
                          title: "{{ yes_button }}"
                        - action: "{{ no_action }}"
                          title: "{{ no_button }}"
                - variables:
                    sent_count: "{{ sent_count | int + 1 }}"
                - wait_for_trigger:
                    - trigger: event
                      event_type: mobile_app_notification_action
                      event_data:
                        action: "{{ yes_action }}"
                    - trigger: event
                      event_type: mobile_app_notification_action
                      event_data:
                        action: "{{ no_action }}"
                  timeout:
                    minutes: !input reminder_interval_minutes
                  continue_on_timeout: true
                - if:
                    - condition: template
                      value_template: >-
                        {{ wait.trigger is not none and
                           wait.trigger.event.data.get('action') == yes_action }}
                  then:
                    - variables:
                        confirmed: true
                    - action: !input notifier
                      data:
                        message: clear_notification
                        data:
                          tag: "{{ notification_tag }}"

mode: restart
